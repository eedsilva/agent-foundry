services:
  # S3-compatible object storage for BLOB_STORE_MODE=s3. Uncomment this
  # block and configure the S3_* environment variables for your app.
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address :9001
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - '9000:9000'
  #     - '9001:9001'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foundry']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  # minio_data:
