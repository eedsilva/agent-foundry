name: pipeline-regression

# Real-mode foundry pipeline regression (#416): the builder's own golden
# journey with real Docker + disposable per-project Supabase and the fake
# provider CLIs as the LLM boundary. Deliberately nightly/manual, not per-PR:
# it provisions a Supabase stack per run and takes several minutes.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A manual dispatch overlapping the nightly run would fight over Docker.
concurrency:
  group: pipeline-regression
  cancel-in-progress: false

jobs:
  pipeline-regression:
    name: pipeline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The generated scaffold pins pnpm in its `packageManager` field, so the
      # preview's dev command is `pnpm run dev` and it is spawned on the runner
      # itself — only the install is containerized, and only that container has
      # corepack. Without a pnpm on PATH the dev server never reaches the
      # program, and this gate fails in provisioning before a single workflow
      # step exists (#658). Bootstrapped the same way as scaffold-boot in
      # ci.yml: pnpm v10 self-switches to the version the scaffold pins.
      - run: npm install --global pnpm@10
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - name: Fail closed if Docker is unavailable on the runner
        run: docker info
      # No build step: vitest resolves @agent-foundry/* straight from src via
      # its aliases, and every subprocess this test spawns (fake CLIs, docker,
      # supabase, the generated app's node scripts) is self-contained.
      - run: RUN_PIPELINE_REGRESSION_E2E=true npx vitest run packages/composition/src/pipeline-regression.e2e.test.ts --pool=threads --maxWorkers=1
