name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reject private registry URLs in the committed lockfiles
        run: |
          if grep -nE 'applied-caas-gateway|internal\.api\.openai\.org|artifactory/api/npm/npm-public' package-lock.json harness/scaffolds/nextjs/pnpm-lock.yaml; then
            echo '::error::A lockfile contains a private registry URL. Regenerate or normalize it before running CI.'
            exit 1
          fi

  storage-e2e:
    name: storage-e2e
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - run: RUN_SUPABASE_STORAGE_E2E=true npx vitest run packages/platform/src/supabase-storage.e2e.test.ts --pool=threads --maxWorkers=1

  auth-e2e:
    name: auth-e2e
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - run: RUN_SUPABASE_AUTH_E2E=true npx vitest run packages/platform/src/supabase-auth.e2e.test.ts --pool=threads --maxWorkers=1

  rls-e2e:
    name: rls-e2e
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - run: RUN_SUPABASE_RLS_E2E=true npx vitest run packages/platform/src/security-rls.e2e.test.ts --pool=threads --maxWorkers=1

  supabase-data-plane-e2e:
    name: supabase-data-plane-e2e
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - name: Fail closed if Docker is unavailable on the runner
        run: docker info
      - name: Build packages used by the golden-flow subprocess
        run: npm run build:packages
      - run: RUN_SUPABASE_DATA_PLANE_E2E=true npx vitest run packages/composition/src/supabase-data-plane.e2e.test.ts --pool=threads --maxWorkers=1

  issue-radar-e2e:
    name: issue-radar-e2e
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - name: Build the packages the e2e fixture imports at runtime (composition and its dependency chain)
        run: npm run build:packages
      - run: npm run e2e --workspace @agent-foundry/api -- issue-radar-golden-journey.spec.ts issue-radar-cross-user-access.spec.ts

  # No seam below the real thing can assert that `pnpm install && pnpm dev`
  # boots both tiers of the generated-app scaffold against its own Supabase
  # stack, so this job copies it out of the repo into a clean directory and
  # does exactly that (#315, #316, ADR 0038 "Validation and rollback").
  scaffold-boot:
    name: scaffold-boot
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Installed with npm rather than a third-party setup action: pnpm v10
      # self-switches to the exact version in the scaffold's `packageManager`
      # field, so this only has to bootstrap *a* pnpm.
      - run: npm install --global pnpm@10
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.62.5
      - name: Copy the scaffold into a clean directory outside the repo
        run: cp -R harness/scaffolds/nextjs "$RUNNER_TEMP/scaffold"
      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ${{ runner.temp }}/scaffold
      # Also writes .env, so everything after this runs on exactly the values a
      # fresh project gets — the failure mode #293 recorded was a shipped
      # example the shipped config schema rejected.
      - name: Start Supabase, applying the migrations and the seed
        run: pnpm db:start
        working-directory: ${{ runner.temp }}/scaffold
      # A schema change that never reached the committed types would otherwise
      # only surface when a generated app failed to compile.
      - name: Assert the committed types match the schema
        run: |
          pnpm db:types
          diff -u "$GITHUB_WORKSPACE/harness/scaffolds/nextjs/apps/api/src/database.types.ts" \
            apps/api/src/database.types.ts \
            || { echo '::error::apps/api/src/database.types.ts is stale — run `pnpm db:types` and commit it.'; exit 1; }
        working-directory: ${{ runner.temp }}/scaffold
      # `next build` typechecks the web tier and `tsc -p` is the api tier's
      # build, so this covers `pnpm typecheck` without compiling twice.
      - name: Build both tiers
        run: pnpm build
        working-directory: ${{ runner.temp }}/scaffold
      - name: Run scaffold quality gates
        run: pnpm format:check && pnpm lint && pnpm test
        working-directory: ${{ runner.temp }}/scaffold
      - name: Assert the database and both tiers answer
        run: pnpm smoke
        working-directory: ${{ runner.temp }}/scaffold
      # Every project that starts a stack has to be able to give it back
      # (#292): a normal stop leaves no container of its own behind.
      - name: Stop the stack and assert nothing is left running
        run: |
          pnpm db:stop
          # The runner starts nothing else, so every container here is one the
          # stack left behind — no label filter to get wrong.
          if [ -n "$(docker ps -aq)" ]; then
            docker ps -a
            echo '::error::The stack left containers behind after `pnpm db:stop`.'
            exit 1
          fi
        working-directory: ${{ runner.temp }}/scaffold

  static:
    name: static
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:static

  secrets:
    name: secrets
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the web app so the client-bundle scan has something to scan
        run: npm run build --workspace @agent-foundry/contracts && npm run build --workspace @agent-foundry/domain && npm run build --workspace @agent-foundry/web
      - run: npm run secrets:check

  test:
    name: test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Benchmark corpus fixtures pin real, historical commits as their
          # baselineRef and a test resolves them via `git cat-file`; the
          # default shallow (depth-1) checkout only fetches the PR head and
          # would make that resolution fail here even though it passes with
          # a full local clone.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the standalone network-policy sidecar
        run: npm run build --workspace @agent-foundry/executors
      - name: Build the domain package so secret-scan tests can import it
        run: npm run build --workspace @agent-foundry/contracts && npm run build --workspace @agent-foundry/domain
      - run: npm test

  build:
    name: build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # ponytail: mock-executor-mode fresh run only, ~20-25 min — this repo has
  # no CI-available real provider credentials, so it can only ever compare
  # against a mock-mode baseline. See docs/OPERATIONS.md "Regression gate de
  # promoção" for what that does and doesn't catch.
  regression-gate:
    name: regression-gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          # The promotion-sensitive-path diff below needs real history to
          # diff against, not just the shallow default checkout of the PR tip.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Decide whether this change touches a promotion-sensitive path
        id: gate-check
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            RUN=$(git diff --name-only "$BASE_SHA" HEAD | npx tsx scripts/promotion-gate-check.ts)
            echo "run=$RUN" >> "$GITHUB_OUTPUT"
          fi
      # benchmark.ts exits 1 whenever any case fails, and under --executor-mode
      # mock nearly every case is *expected* to fail (see docs/OPERATIONS.md
      # "Regression gate de promoção"). Generation is not the verdict — the
      # comparison below is, and it is what catches a case that regressed from
      # passing to failing. Without this the job dies here and never compares.
      - name: Generate fresh benchmark results (mock executor)
        if: steps.gate-check.outputs.run == 'true'
        continue-on-error: true
        run: npx tsx scripts/benchmark.ts --all --executor-mode mock
      - name: Compare against the frozen v0.9 baseline
        if: steps.gate-check.outputs.run == 'true'
        run: npx tsx scripts/benchmark.ts --gate

  sandbox-sbom:
    name: sandbox-sbom
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pull the pinned sandbox base image
        run: docker pull node@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
      - name: Generate SBOM
        # Pinned by commit, not the floating v0 tag: this is the one third-party
        # (non actions/*) action in this workflow, and CodeQL flags floating tags
        # on third-party actions as a supply-chain risk.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: node@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
          format: spdx-json
          output-file: sandbox-image.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-sbom
          path: sandbox-image.spdx.json
          retention-days: 90
