schemaVersion: '1'
id: web-app-v1
name: Web application delivery pipeline
description: Plans, waits for operator approval, then implements the task graph one task at a time — each gated on deterministic checks and repaired only on a real failure — before one blocking full-suite verification, an advisory release assessment, and final diff approval.
stack: nextjs
# Which executor runs which kind of task, head of the list first (ADR 0046).
# A table an operator can read before the run starts, rather than a six-dimension
# score they cannot predict. The product is exactly Claude + Codex (#438); each
# is an independent quota pool and a genuinely different attempt. `repair` and
# `verification` lead with a different vendor from `implementation` on purpose:
# re-reading your own work is the weakest check.
routing:
  - taskKind: planning
    executors: [claude, codex]
  - taskKind: implementation
    executors: [claude, codex]
  - taskKind: repair
    executors: [codex, claude]
  - taskKind: verification
    executors: [codex, claude]
nodes:
  # One model call, then the operator decides. No model grades another model's
  # plan as a blocking gate (ADR 0042).
  - id: plan
    type: agent
    role: planner
    taskKind: planning
    title: Turn the PRD into an executable product and engineering plan
    instructions: >-
      Analyze the PRD, identify missing or contradictory requirements, define scope boundaries,
      user journeys, acceptance criteria, dependencies, milestones, and a dependency-aware task graph.
      Every task must include acceptanceMode: deterministic-only or browser-visible. Use deterministic-only
      for migrations, configuration, refactors, and backend work whose acceptance is fully covered by
      generated-app checks. Use browser-visible only when a user-visible journey, rendered state,
      navigation, or denial must be asserted in the running app. Never infer the mode from free-text at
      execution time. Optimize for a small shippable first version rather than an imaginary perfect platform.
    inputArtifacts: [prd]
    outputArtifact: plan.current
    outputContract: task-graph
    mutatesWorkspace: false
    harnessTags: [planning, web]
    profile:
      complexity: 4
      risk: 3
      preferredTags: [planning, reasoning]
    maxAttempts: 3

  - id: plan-approval
    type: approval-gate
    title: Operator plan approval
    artifact: plan.current
    outputArtifact: plan.approval
    actions: [approve, reject]
    onReject: end

  # One task at a time, in dependency order, each with its own commit. A failing
  # task costs that task; the tasks committed before it survive.
  - id: task-execution
    type: for-each-task
    title: Implement the approved task graph
    taskGraphArtifact: plan.current
    implement:
      id: implement
      type: agent
      role: developer
      taskKind: implementation
      title: Implement one planned task
      instructions: >-
        Inspect the workspace, then implement exactly the task described below. Include configuration,
        migrations or schemas when needed, meaningful tests, error handling, and developer documentation.
        Run the relevant checks. Do not replace real behavior with placeholders merely to make tests green.
      inputArtifacts: [prd, plan.current]
      outputArtifact: implementation.report
      mutatesWorkspace: true
      harnessTags: [coding, nextjs, typescript]
      profile:
        complexity: 5
        risk: 4
        preferredTags: [coding, repository, tool-use]
      # Honoured: attempts per task before the task — and the run — fails.
      maxAttempts: 2
    # The task's gate includes cheap source-integrity checks; the full compiler,
    # test, migration and preview gates run once after the graph lands.
    verify:
      id: verify-task
      type: verify
      title: Run the task's deterministic checks
      outputArtifact: verification.report
      # Fixed silently before anything is judged, so repair is only invoked
      # for what a machine cannot fix.
      autofixScripts: [format, 'lint:fix']
      # Tasks are dependency-ordered and may intentionally leave the workspace
      # temporarily uncompilable while a later task updates a caller. The
      # blocking compiler gate belongs to full-suite-verification, after the
      # complete graph has landed.
      scripts: [server-actions:check]
      # Lint and unit tests can gate each task as they are introduced. The
      # database smoke is intentionally deferred to the full-suite node: an
      # early migration task can legitimately leave the scaffold smoke script
      # referring to the old schema until a later task updates it.
      optionalScripts: [lint, test]
      includeGitDiffCheck: true
    repair:
      id: repair-task
      type: agent
      role: fixer
      taskKind: repair
      title: Repair the task's failing checks
      instructions: >-
        Read the failed command output in the verification report, reproduce the failure, and fix its root
        cause. Never remove a meaningful check, reduce test coverage, or paper over a type error.
      inputArtifacts: [prd, plan.current, verification.report]
      outputArtifact: verification.fix
      mutatesWorkspace: true
      harnessTags: [repair, coding, testing]
      profile:
        complexity: 4
        risk: 5
        preferredTags: [repair, coding, tool-use]
      # Bounded: exhausting this fails the task with the checks still red, and
      # the tasks committed before it survive.
      maxAttempts: 2
    # Typecheck passing does not mean the feature works. The task's own
    # acceptance check becomes a browser assertion against the live preview,
    # run only once the deterministic checks are green (ADR 0047).
    browser:
      plan:
        id: plan-task-browser-test
        type: agent
        role: tester
        taskKind: verification
        title: Turn the task's acceptance check into a browser plan
        instructions: >-
          Produce a schemaVersion 1 declarative browser test plan that asserts this task's acceptance
          check against the running application. Use only relative app paths, supported semantic
          locators, actions and assertions. Verify presence or content with assertions, never with
          clicks: click and fill only interactive controls (buttons, links, inputs) the flow actually
          operates. Where the task concerns another user's data, assert the
          denial itself: sign in as one account and confirm the other account's rows are not visible.
        inputArtifacts: [prd, plan.current, verification.report]
        outputArtifact: browser-test.plan
        mutatesWorkspace: false
        harnessTags: [testing, browser]
        maxAttempts: 3
      check:
        id: assert-task
        type: verify
        title: Assert the task's acceptance check in a browser
        outputArtifact: browser-verification.report
        browserTestPlanArtifact: browser-test.plan
        scripts: []
        includeGitDiffCheck: false

  - id: full-suite-verification
    type: verify
    title: Run the full repository verification suite
    outputArtifact: verification.report
    scripts: [typecheck, lint, test, build]
    optionalScripts: ['db:start', 'db:reset', smoke]
    includeGitDiffCheck: true
    blocksOnFailure: true

  - id: release-assessment
    type: agent
    role: tester
    taskKind: verification
    title: Perform a final advisory release assessment
    instructions: >-
      Inspect the actual repository, running application when available, PRD, plan, and full-suite report.
      Exercise critical paths and failure paths that static checks may miss. Record concrete findings,
      decisions, risks, and next actions. This assessment is advisory: do not modify the workspace and do not
      treat approved as a workflow gate.
    inputArtifacts: [prd, plan.current, verification.report]
    outputArtifact: release.review
    mutatesWorkspace: false
    harnessTags: [testing, release, review]
    profile:
      complexity: 4
      risk: 5
      preferredTags: [testing, review, reasoning]
    maxAttempts: 1

  - id: diff-approval
    type: approval-gate
    title: Human diff approval
    artifact: release.review
    outputArtifact: diff.approval
