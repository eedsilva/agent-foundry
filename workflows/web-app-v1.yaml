schemaVersion: '1'
id: web-app-v1
name: Web application delivery pipeline
description: Plans, waits for operator approval, then implements the task graph one task at a time — each gated on deterministic checks and repaired only on a real failure — before verifying and performing a final release assessment for a web application.
stack: nextjs
nodes:
  # One model call, then the operator decides. No model grades another model's
  # plan as a blocking gate (ADR 0042).
  - id: plan
    type: agent
    role: planner
    taskKind: planning
    title: Turn the PRD into an executable product and engineering plan
    instructions: >-
      Analyze the PRD, identify missing or contradictory requirements, define scope boundaries,
      user journeys, acceptance criteria, dependencies, milestones, and a dependency-aware task graph.
      Optimize for a small shippable first version rather than an imaginary perfect platform.
    inputArtifacts: [prd]
    outputArtifact: plan.current
    outputContract: task-graph
    mutatesWorkspace: false
    harnessTags: [planning, web]
    profile:
      complexity: 4
      risk: 3
      preferredTags: [planning, reasoning]
    maxAttempts: 3

  - id: plan-approval
    type: approval-gate
    title: Operator plan approval
    artifact: plan.current
    outputArtifact: plan.approval
    actions: [approve, reject]
    onReject: end

  # One task at a time, in dependency order, each with its own commit. A failing
  # task costs that task; the tasks committed before it survive.
  - id: task-execution
    type: for-each-task
    title: Implement the approved task graph
    taskGraphArtifact: plan.current
    implement:
      id: implement
      type: agent
      role: developer
      taskKind: implementation
      title: Implement one planned task
      instructions: >-
        Inspect the workspace, then implement exactly the task described below. Include configuration,
        migrations or schemas when needed, meaningful tests, error handling, and developer documentation.
        Run the relevant checks. Do not replace real behavior with placeholders merely to make tests green.
      inputArtifacts: [prd, plan.current]
      outputArtifact: implementation.report
      mutatesWorkspace: true
      harnessTags: [coding, nextjs, typescript]
      profile:
        complexity: 5
        risk: 4
        preferredTags: [coding, repository, tool-use]
      # Honoured: attempts per task before the task — and the run — fails.
      maxAttempts: 2
    # The task's gate is the compiler, the linter, the tests, an applied
    # migration and a booting preview — not a model's opinion (ADR 0045).
    verify:
      id: verify-task
      type: verify
      title: Run the task's deterministic checks
      outputArtifact: verification.report
      # Fixed silently before anything is judged, so repair is only invoked
      # for what a machine cannot fix.
      autofixScripts: [format, 'lint:fix']
      scripts: [typecheck]
      # Gating from the moment the generated project defines them, in order.
      # The scaffold ships the last three: `db:start` is idempotent and brings
      # up this project's own Supabase stack (writing .env), `db:reset`
      # re-applies every migration and the seed against it, and `smoke` boots
      # both tiers and asserts they answer. A generated project grows a lint
      # and a test script as the tasks that need them land.
      optionalScripts: [lint, test, 'db:start', 'db:reset', smoke]
      includeGitDiffCheck: true
    repair:
      id: repair-task
      type: agent
      role: fixer
      taskKind: repair
      title: Repair the task's failing checks
      instructions: >-
        Read the failed command output in the verification report, reproduce the failure, and fix its root
        cause. Never remove a meaningful check, reduce test coverage, or paper over a type error.
      inputArtifacts: [prd, plan.current, verification.report]
      outputArtifact: verification.fix
      mutatesWorkspace: true
      harnessTags: [repair, coding, testing]
      profile:
        complexity: 4
        risk: 5
        preferredTags: [repair, coding, tool-use]
      # Bounded: exhausting this fails the task with the checks still red, and
      # the tasks committed before it survive.
      maxAttempts: 2
    # Typecheck passing does not mean the feature works. The task's own
    # acceptance check becomes a browser assertion against the live preview,
    # run only once the deterministic checks are green (ADR 0047).
    browser:
      plan:
        id: plan-task-browser-test
        type: agent
        role: tester
        taskKind: verification
        title: Turn the task's acceptance check into a browser plan
        instructions: >-
          Produce a schemaVersion 1 declarative browser test plan that asserts this task's acceptance
          check against the running application. Use only relative app paths, supported semantic
          locators, actions and assertions. Where the task concerns another user's data, assert the
          denial itself: sign in as one account and confirm the other account's rows are not visible.
        inputArtifacts: [prd, plan.current, verification.report]
        outputArtifact: browser-test.plan
        mutatesWorkspace: false
        harnessTags: [testing, browser]
        maxAttempts: 3
      check:
        id: assert-task
        type: verify
        title: Assert the task's acceptance check in a browser
        outputArtifact: browser-verification.report
        browserTestPlanArtifact: browser-test.plan
        scripts: []
        includeGitDiffCheck: false

  - id: deterministic-verification
    type: quality-loop
    title: Deterministic verification gate
    maxIterations: 3
    check:
      id: verify-workspace
      type: verify
      title: Run configured deterministic repository checks
      outputArtifact: verification.report
      scripts: [typecheck, lint, test, build]
      includeGitDiffCheck: true
    repair:
      id: repair-verification
      type: agent
      role: fixer
      taskKind: repair
      title: Repair deterministic verification failures
      instructions: >-
        Read the failed command outputs, reproduce the failures, fix their root causes, and rerun the relevant
        commands. Never remove a meaningful check, reduce test coverage, or paper over a type error.
      inputArtifacts: [prd, plan.current, verification.report]
      outputArtifact: verification.fix
      mutatesWorkspace: true
      harnessTags: [repair, testing, coding]
      profile:
        complexity: 4
        risk: 5
        preferredTags: [repair, coding, tool-use]
      maxAttempts: 3
    approval:
      artifact: verification.report
      path: approved
      equals: true

  - id: browser-verification
    type: quality-loop
    title: Browser verification gate
    maxIterations: 3
    setup:
      id: plan-browser-test
      type: agent
      role: tester
      taskKind: verification
      title: Define the reproducible browser test plan
      instructions: Produce a schemaVersion 1 declarative browser test plan for the critical CRUD journey. Use only relative app paths, supported semantic locators, actions, and assertions.
      inputArtifacts: [prd, plan.current, verification.report]
      outputArtifact: browser-test.plan
      mutatesWorkspace: false
      harnessTags: [testing, browser]
      maxAttempts: 3
    check:
      id: verify-browser
      type: verify
      title: Run the declarative browser test plan
      outputArtifact: browser-verification.report
      browserTestPlanArtifact: browser-test.plan
      scripts: []
      includeGitDiffCheck: false
    repair:
      id: repair-browser
      type: agent
      role: fixer
      taskKind: repair
      title: Repair browser verification failures
      instructions: Reproduce each failed step from the exact browser plan and report, repair the root cause, and retain the plan unchanged for the rerun.
      inputArtifacts: [prd, plan.current, browser-test.plan, browser-verification.report]
      outputArtifact: browser-verification.fix
      mutatesWorkspace: true
      harnessTags: [repair, browser, testing]
      maxAttempts: 3
    approval:
      artifact: browser-verification.report
      path: approved
      equals: true

  - id: diff-approval
    type: approval-gate
    title: Human diff approval
    artifact: browser-verification.report
    outputArtifact: diff.approval

  - id: release-assessment
    type: quality-loop
    title: Final release-readiness assessment
    maxIterations: 2
    check:
      id: assess-release
      type: agent
      role: tester
      taskKind: verification
      title: Perform a final adversarial release assessment
      instructions: >-
        Inspect the actual repository and deterministic verification report. Exercise critical paths and failure
        paths that static checks may miss. Confirm the implementation satisfies the PRD and acceptance criteria.
        Put the final release verdict in approved and provide concrete evidence for it.
      inputArtifacts:
        [prd, plan.current, verification.report, browser-test.plan, browser-verification.report]
      outputArtifact: release.review
      mutatesWorkspace: false
      harnessTags: [testing, release, review]
      profile:
        complexity: 4
        risk: 5
        preferredTags: [testing, review, reasoning]
      maxAttempts: 3
    repair:
      id: repair-release
      type: agent
      role: fixer
      taskKind: repair
      title: Repair defects from the final release assessment
      instructions: >-
        Fix every reproducible release blocker, add regression coverage, and run the affected deterministic
        checks. Do not reinterpret requirements merely to avoid the defect.
      inputArtifacts: [prd, plan.current, verification.report, release.review]
      outputArtifact: release.fix
      mutatesWorkspace: true
      harnessTags: [repair, testing, release]
      profile:
        complexity: 4
        risk: 5
        preferredTags: [repair, coding, tool-use]
      maxAttempts: 3
    approval:
      artifact: release.review
      path: approved
      equals: true
